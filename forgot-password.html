<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié — PenguStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --glacier: #b8e0f7;
            --deep: #051e30;
            --ocean: #0a3d62;
            --teal: #17a589;
            --gold: #f0c040;
            --aurora1: #43e6b5;
            --aurora2: #7b68ee;
            --aurora3: #ff6fb7;
            --text-accent: #b8e0f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--deep);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .aurora-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .aurora-bg::before,
        .aurora-bg::after,
        .aurora-bg .a3 {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .18;
        }

        .aurora-bg::before {
            width: 700px;
            height: 400px;
            background: var(--aurora1);
            top: -100px;
            left: -200px;
            animation: drift1 14s ease-in-out infinite alternate;
        }

        .aurora-bg::after {
            width: 600px;
            height: 350px;
            background: var(--aurora2);
            top: 50px;
            right: -150px;
            animation: drift2 17s ease-in-out infinite alternate;
        }

        .aurora-bg .a3 {
            width: 500px;
            height: 300px;
            background: var(--aurora3);
            bottom: 100px;
            left: 30%;
            animation: drift3 12s ease-in-out infinite alternate;
        }

        @keyframes drift1 {
            to {
                transform: translate(80px, 60px) scale(1.1);
            }
        }

        @keyframes drift2 {
            to {
                transform: translate(-60px, 80px) scale(.9);
            }
        }

        @keyframes drift3 {
            to {
                transform: translate(50px, -70px) scale(1.2);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .forgot-card {
            background: rgba(5, 30, 48, .85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(184, 224, 247, .12);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .forgot-title {
            font-family: 'Righteous', cursive;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 8px;
        }

        .forgot-subtitle {
            color: rgba(255, 255, 255, .6);
            font-size: .95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-accent);
            font-size: .9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(184, 224, 247, .07);
            border: 1.5px solid rgba(184, 224, 247, .15);
            border-radius: 10px;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s, background .2s;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, .35);
        }

        .form-group input:focus {
            border-color: var(--teal);
            background: rgba(184, 224, 247, .12);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--teal), #0e7a62);
            color: #fff;
            padding: 12px;
            border-radius: 50px;
            font-weight: 800;
            font-size: .95rem;
            border: none;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 4px 20px rgba(23, 165, 137, .35);
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(23, 165, 137, .5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .forgot-footer {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-footer a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 700;
            font-size: .9rem;
            transition: color .2s;
        }

        .forgot-footer a:hover {
            color: var(--text-accent);
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: .9rem;
            font-weight: 600;
            display: none;
        }

        .alert.success {
            background: rgba(46, 204, 113, .15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, .3);
            display: block;
        }

        .alert.error {
            background: rgba(231, 76, 60, .15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, .3);
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 3px solid rgba(184, 224, 247, .2);
            border-top: 3px solid var(--teal);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin .8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="a3"></div>
    </div>

    <div class="container">
        <div class="forgot-card">
            <div class="forgot-header">
                <div class="forgot-icon">🔑</div>
                <h1 class="forgot-title">Réinitialiser le mot de passe</h1>
                <p class="forgot-subtitle">Entrez votre adresse email et nous vous enverrons un lien pour créer un nouveau mot de passe.</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="votre@email.com"
                        required
                    >
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Envoyer le lien de réinitialisation
                </button>
            </form>

            <div class="loading" id="loadingState">
                <div class="spinner"></div>
                <p>Envoi en cours...</p>
            </div>

            <div class="forgot-footer">
                <a href="/">← Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const loadingState = document.getElementById('loadingState');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            setTimeout(() => {
                alertBox.className = 'alert';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            if (!email) {
                showAlert('Veuillez entrer une adresse email valide.', 'error');
                return;
            }

            submitBtn.style.display = 'none';
            loadingState.style.display = 'block';

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✓ Email envoyé ! Consultez votre boîte mail pour continuer.', 'success');
                    emailInput.value = '';
                    form.style.display = 'none';
                } else {
                    showAlert(data.message || 'Une erreur est survenue.', 'error');
                    submitBtn.style.display = 'block';
                    loadingState.style.display = 'none';
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('Erreur de connexion. Veuillez réessayer plus tard.', 'error');
                submitBtn.style.display = 'block';
                loadingState.style.display = 'none';
            }
        });
    </script>
</body>
</html>

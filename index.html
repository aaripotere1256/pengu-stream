<script>
  // Enregistrement du Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('[PWA] SW enregistré :', reg.scope))
        .catch(err => console.warn('[PWA] SW échec :', err));
    });
  }

  // Bouton "Installer l'app" (banner natif Android/desktop)
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;

    // Si tu veux afficher un bouton custom dans ton UI, décommente :
    // const btn = document.getElementById('btn-install-pwa');
    // if (btn) btn.style.display = 'flex';
  });

  // Appelle cette fonction depuis ton bouton "Installer" si tu en as un
  window.installPWA = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('[PWA] Résultat installation :', outcome);
    deferredPrompt = null;
  };

  // Détection : est-on déjà en mode standalone (PWA installée) ?
  window.isPWA = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
</script>

        .aurora-bg::before,

            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .18;
        }

        .aurora-bg::before {
            width: 700px;
            height: 400px;
            background: var(--aurora1);
            top: -100px;
            left: -200px;
            animation: drift1 14s ease-in-out infinite alternate;
        }

        .aurora-bg::after {
            width: 600px;
            height: 350px;
            background: var(--aurora2);
            top: 50px;
            right: -150px;
            animation: drift2 17s ease-in-out infinite alternate;
        }

        .aurora-bg .a3 {
            width: 500px;

            background: var(--aurora3);
            bottom: 100px;
            left: 30%;

            font-size: .67rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 50px;
            letter-spacing: .5px;
        }

        .badge-new {
            background: var(--aurora3);
        }

        .badge-NULL {
            background: transparent;
            color: transparent;
            box-shadow: none;
            border: none;
            pointer-events: none;
            padding: 0;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        .badge-popular {
            background: var(--gold);
            color: var(--deep);
        }

        .badge-serie {
            background: var(--aurora2);
        }

        .card-vip-lock {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, var(--gold), #e67e22);
            color: #000;
            padding: 3px 8px;
            border-radius: 50px;
            font-size: .67rem;
            font-weight: 800;
        }

        .card-tags-row {
            display: flex;
            gap: 5px;
            margin-bottom: 7px;
            align-items: center;
            flex-wrap: wrap;
        }

        .card-type-tag-ext {
            background: rgba(184, 224, 247, .12);
            color: var(--text-accent);
            border: 1px solid rgba(184, 224, 247, .2);
            padding: 2px 7px;
            border-radius: 50px;
            font-size: .62rem;
            font-weight: 900;
            letter-spacing: .5px;
        }

        .card-cat-tag-ext {
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .6);
            padding: 2px 7px;
            border-radius: 50px;
            font-size: .62rem;
            font-weight: 800;
            letter-spacing: .3px;
        }

        .card-play-btn {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0);
            transition: background .25s;
        }

        .card:hover .card-play-btn {
            background: rgba(0, 0, 0, .45);
        }

        .card-play-icon {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, .15);
            border: 2px solid rgba(255, 255, 255, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            opacity: .9;
            transition: opacity .2s;
        }

        .card:hover .card-play-icon {
            opacity: 1;
        }

        /* PANEL */
        #panel {
            position: fixed;
            right: -320px;
            top: 0;
            z-index: 210;
            width: 320px;
            height: 100vh;
            background: rgba(3, 18, 30, .98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(184, 224, 247, .12);
            overflow-y: auto;
            overflow-x: hidden;
            transition: right .35s cubic-bezier(.33, .66, .66, 1);
            padding: 20px;
            box-sizing: border-box;
        }

        #panel.open {
            right: 0;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            font-family: 'Righteous', cursive;
        }

        .panel-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .panel-section {
            margin-bottom: 24px;
        }

        .panel-label {
            font-size: .8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .4);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 10px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            background: rgba(184, 224, 247, .06);
            border: 1px solid rgba(184, 224, 247, .15);
            border-radius: 8px;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: .88rem;
            outline: none;
            transition: border-color .2s, background .2s;
        }

        .form-control:focus {
            border-color: var(--teal);
            background: rgba(184, 224, 247, .12);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, .25);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-card {
            border-radius: 12px;
            padding: 14px 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all .25s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .theme-card:hover {
            transform: translateY(-2px);
        }

        .theme-card.active-theme {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, .2);
        }

        .tc-icon {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 5px;
        }

        .tc-name {
            font-weight: 700;
            font-size: .75rem;
            color: #fff;
        }

        .tc-desc {
            font-size: .65rem;
            opacity: .5;
            margin-top: 2px;
        }

        .divider {
            height: 1px;
            background: rgba(184, 224, 247, .1);
            margin: 16px 0;
        }

        .btn-logout {
            width: 100%;
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(231, 76, 60, .3), rgba(192, 57, 43, .3));
            border: 1.5px solid rgba(231, 76, 60, .3);
            color: #e74c3c;
            border-radius: 8px;
            font-weight: 700;
            font-size: .85rem;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Nunito', sans-serif;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, rgba(231, 76, 60, .4), rgba(192, 57, 43, .4));
            border-color: rgba(231, 76, 60, .5);
        }

        /* BURGER NAV — responsive */
        @media (max-width: 860px) {
            nav {
                padding: 12px 20px;
            }

            nav.scrolled {
                padding: 8px 20px;
            }

            .nav-links {
                display: none;
            }

            #nav-burger {
                display: block;
            }

            .catalogue {
                padding: 60px 20px;
            }
        }

        @media (max-width: 600px) {
            .hero {
                padding: 80px 20px 40px;
            }

            .hero-penguin {
                width: min(240px, 60vw);
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .theme-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- Étoiles de fond -->
    <div class="stars" id="stars"></div>

    <!-- Aurora dynamique -->
    <div class="aurora-bg">
        <div class="a3"></div>
    </div>

    <!-- Particules festives -->
    <div id="theme-particles"></div>

    <!-- NAV -->
    <nav>
        <a href="#" class="logo">
            <span>🐧</span>
            <span>PenguStream</span>
        </a>
        <div class="nav-links">
            <a href="#catalogue">Catalogue</a>
            <a href="#" id="btn-login">Se connecter</a>
            <button class="btn-nav" id="btn-subscribe">S'abonner</button>
        </div>
        <div id="nav-user" style="display: none;">
            <img id="user-avatar" src="" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(184,224,247,.3); object-fit: cover;">
            <span id="user-name" style="font-size: .9rem; color: rgba(255,255,255,.7);"></span>
            <button id="nav-burger" style="display: none;">☰</button>
        </div>
        <button id="nav-burger">☰</button>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <img src="🐧" alt="Penguin Mascot" class="hero-penguin">
        <h1 class="hero-title">PenguStream</h1>
        <p class="hero-sub">
            La plateforme de streaming ultime pour amateurs de contenu glacé.
            Découvrez les meilleures séries, films & documentaires en exclusivité.
        </p>
        <div class="hero-btns">
            <button class="btn-primary" id="btn-hero-play">▶ Regarder maintenant</button>
            <button class="btn-secondary" id="btn-hero-discover">✦ Découvrir le catalogue</button>
        </div>
    </section>

    <!-- CATALOGUE -->
    <section class="catalogue" id="catalogue">
        <h2 class="section-title">Découvrez notre catalogue</h2>
        <p class="section-sub">Filtrez et explorez nos meilleures productions</p>

        <!-- Barre de recherche -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Rechercher un film ou une série...">
        </div>

        <!-- Filtres par type -->
        <div class="type-filters">
            <button class="type-btn active" data-type="all">Tous</button>
            <button class="type-btn" data-type="series">Séries</button>
            <button class="type-btn" data-type="films">Films</button>
            <button class="type-btn" data-type="documentaires">Documentaires</button>
        </div>

        <!-- Filtres par catégorie -->
        <div class="cat-filters" id="cat-filters"></div>

        <!-- Grille de cartes -->
        <div class="cards-grid" id="cards-grid"></div>
    </section>

    <!-- PANEL (Settings/Theme) -->
    <div id="panel">
        <button class="panel-close" id="close-panel">✕</button>
        <h3 class="panel-title">Paramètres</h3>

        <div class="panel-section">
            <label class="panel-label">Thème</label>
            <div class="theme-grid" id="theme-grid"></div>
        </div>

        <div class="divider"></div>

        <div class="panel-section" id="auth-section">
            <button class="btn-logout" id="btn-logout" style="display: none;">Se déconnecter</button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script src="app.js"></script>

</body>

</html>
